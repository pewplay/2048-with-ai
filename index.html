<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048 AI</title>
  <link href="./2048 AI_files/main.css" rel="stylesheet" type="text/css">
</head>
<body>
 
  <script src="./2048 AI_files/jquery-1.10.2.min.js"></script>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048 AI</h1>
      <div class="scores-container">
        <div class="score-container">0<div class="score-addition">+0</div></div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p>Watch the AI join the numbers and reach the highest tile it can!</p>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
	        <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container"></div>
      
      <div class="ai-panel">
        <a class="pause-button">Pause</a>
        <div class="ai-panel-header">AI mode:</div>
        <label title="Looks ahead and scores each possible move"><input type="radio" name="ai-mode" class="smart-ai-button" checked="">Smart</label><br>
        <label title="Up, Left, Up, Left, etc."><input type="radio" name="ai-mode" class="algorithm-ai-button">Algorithm-based</label><br>
        <label title="Up &gt; Left &gt; Right &gt; Down"><input type="radio" name="ai-mode" class="priority-ai-button">Priority-based</label><br>
        <label title="Picks a random direction"><input type="radio" name="ai-mode" class="rng-ai-button">Random</label><br>
        <div class="ai-panel-header">Speed:</div>
        <label><input type="radio" name="ai-speed" class="full-speed-button">Full</label><br>
        <label><input type="radio" name="ai-speed" class="fast-speed-button" checked="">Fast</label><br>
        <label><input type="radio" name="ai-speed" class="slow-speed-button">Slow</label><br>
        <div class="ai-panel-header">Tile generator:</div>
        <label><input type="radio" name="ai-tilegen" class="random-tile-button" checked="">Random</label><br>
        <label><input type="radio" name="ai-tilegen" class="evil-tile-button">Evil</label><br>
        <div class="ai-panel-header">Highest numbers:</div>
        <div class="stats-container"></div>
        
      </div>
    </div>


    <div class="copy-json"></div>
  </div>

  <script src="./2048 AI_files/bind_polyfill.js"></script>
  <script src="./2048 AI_files/classlist_polyfill.js"></script>
  <script src="./2048 AI_files/animframe_polyfill.js"></script>
  <script src="./2048 AI_files/basic_ai.js"></script>
  <script src="./2048 AI_files/smart_ai.js"></script>
  <script src="./2048 AI_files/ai_input_manager.js"></script>
  <script src="./2048 AI_files/html_actuator.js"></script>
  <script src="./2048 AI_files/grid.js"></script>
  <script src="./2048 AI_files/tile.js"></script>
  <script src="./2048 AI_files/local_storage_manager.js"></script>
  <script src="./2048 AI_files/game_manager.js"></script>
  <script src="./2048 AI_files/application.js"></script>


</body></html>
